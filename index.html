    <div class="container">
        <h2>Text-To-Speech App</h2>
        <div class="card">
            <textarea cols="32" rows="10" name="text" id="text" placeholder="Type what  you want to convert to speech here.." autofocus></textarea>
        </div>
               <label for="speed">Speed</label>
                <input id="speed" type="range" max="2"> 
       <br>
       <label for="pitch">Pitch</label>
        <input id="pitch" type="range" max="2">
            <br>
        <button id="btn" type="submit">Listen</button>
